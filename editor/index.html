<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#1b1e22">
  <meta name="robots" content="noindex">
  <title>Edit player list</title>
  <link rel="stylesheet" href="../assets/style.css?v=profile-polish-1">
  <link rel="stylesheet" href="editor.css?v=profile-polish-1">
  <script type="module" src="editor.js?v=profile-polish-1"></script>
</head>
<body>
<main class="container editor">
  <div class="editor-topbar"><a id="back" class="inline-back" href="../">‹ Back to player search</a><button type="button" id="theme-toggle">Light mode</button></div>
  <h1 id="title">Edit player list</h1>
  <p>Drag the handle or use the arrow buttons to change placement. Changes stay in this tab until you save.</p>
  <p id="status" role="status"></p>
  <section class="singlepanel">
    <label for="list-select">Manage list</label>
    <select id="list-select" disabled></select>
    <button type="button" id="create-list" disabled>Create New List</button>
    <button type="button" id="create-placement" disabled>Create New Placement</button>
  </section>
  <section class="singlepanel" aria-labelledby="profile-colors-heading">
    <h2 id="profile-colors-heading">Profile colors</h2>
    <p>These colors apply to the pixel art, links, and difficulty faces on every list in this profile.</p>
    <form id="profile-colors" class="editor-fields">
      <label>Left side <input type="color" id="profile-left" disabled></label>
      <label>Right side <input type="color" id="profile-right" disabled></label>
      <label>Player ID <input type="password" id="profile-code" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" autocomplete="off" required disabled></label>
      <button type="submit" id="save-colors" disabled>Save profile colors</button>
    </form>
    <p id="colors-status" role="status"></p>
  </section>
  <dialog id="new-list-dialog">
    <form id="new-list-form">
      <h2>Create New List</h2>
      <label>List name <input id="new-list-title" maxlength="60" required></label>
      <label>Game <select id="new-list-game"></select></label>
      <label>Player ID <input id="new-list-code" type="password" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" autocomplete="off" required></label>
      <p id="new-list-status" role="status"></p>
      <button type="submit">Create list</button>
      <button type="button" id="cancel-list">Cancel</button>
    </form>
  </dialog>
  <datalist id="celeste-rank-options">
    <option value="Beginner"></option>
    <option value="Intermediate"></option>
    <option value="Advanced"></option>
    <option value="Expert"></option>
    <option value="Grandmaster"></option>
    <option value="Cracked Grandmaster"></option>
    <option value="GM+1"></option>
    <option value="GM+2"></option>
  </datalist>
  <ol id="levels"></ol>
  <button type="button" disabled id="save">Save changes</button>
  <dialog id="confirm">
    <form id="confirm-form">
      <h2>Save rankings</h2>
      <p id="save-status" role="status"></p>
      <fieldset id="save-credentials">
        <label for="player-code">Player ID (16 digits)</label>
      <input id="player-code" type="password" inputmode="numeric" pattern="[0-9]{16}" maxlength="16" autocomplete="off" required>
        <button type="submit">Confirm and save</button>
      </fieldset>
      <button type="button" id="cancel">Cancel</button>
    </form>
  </dialog>
</main>
</body>
</html>
